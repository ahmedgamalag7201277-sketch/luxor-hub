function chips(){return `<div class="chips"><button class="chip ${S.cat?'':'on'}" onclick="S.cat='';render()">الكل / All</button>${CK.map(k=>`<button class="chip ${S.cat==k?'on':''}" onclick="S.cat='${k}';render()">${C[k][0]} ${cl(k)}</button>`).join('')}</div>`}
let LM=null,LK=null,LR=null,LU=null;
const COL={business:'#D9622B',site:'#0E3B4F',museum:'#6B4E9B',transport:'#2A7DE1'};
function mapv(){return `<div class="mp"><div class="pnl"><form class="sb" style="margin:0 0 6px;border:1px solid var(--bd);background:var(--sf)" onsubmit="event.preventDefault()"><input id="mq" oninput="S.q=this.value;mapRefresh(1)" placeholder="${t('ph')}" aria-label="${t('ph')}" style="color:var(--tx)"><button class="btn" type="button" onclick="locate()" aria-label="${t('loc')}">📡</button></form><div class="chips" id="mchips"></div><div id="mnote" style="font-size:12px;color:var(--mu)"></div><div class="res" id="mres"></div></div><div class="mapw"><div id="lmap" role="region" aria-label="${B('خريطة الأقصر','Luxor map')}"></div><div id="mcard"></div></div></div>${note()}`}
function initMap(){const el=document.getElementById('lmap');if(!el)return;
if(LM){try{LM.remove()}catch(e){}LM=null}
document.getElementById('mq').value=S.q||'';
if(typeof L==='undefined'){el.innerHTML=`<div role="alert" style="padding:30px;text-align:center"><p><b>${B('تعذر تحميل الخريطة. حاول مرة أخرى.','Could not load the map. Please try again.')}</b></p><button class="btn" onclick="location.reload()">${B('إعادة المحاولة','Retry')}</button></div>`;mapRefresh(0);return}
LM=L.map(el,{zoomControl:true}).setView([25.715,32.62],12);
const ter=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'Map data © OpenStreetMap contributors, SRTM | Style © OpenTopoMap (CC-BY-SA)'});
const str=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Tiles © Esri'});
ter.addTo(LM);
const bl={};bl[B('تضاريس','Terrain')]=ter;bl[B('شوارع','Streets')]=str;bl[B('قمر صناعي','Satellite')]=sat;
LM.attributionControl.setPrefix('Leaflet');L.control.layers(bl).addTo(LM);
LK=L.layerGroup().addTo(LM);LR=L.layerGroup().addTo(LM);
if(S.pos)userMark();
mapRefresh(S.sel?0:1)}
function userMark(){if(!LM||!S.pos)return;if(LU)LM.removeLayer(LU);LU=L.circleMarker([S.pos.la,S.pos.ln],{radius:9,color:'#fff',weight:3,fillColor:'#2a7de1',fillOpacity:1}).bindTooltip(B('أنت هنا','You are here')).addTo(LM)}
function selPlace(id){S.sel=id;mapRefresh(0)}
function cardHtml(p){return `<div class="pc"><button class="x" aria-label="close" onclick="S.sel=null;mapRefresh(0)">✕</button><div class="ph" data-wk="${p.id}" style="height:120px">${C[p.c][0]}</div><h3 style="margin:0">${C[p.c][0]} ${nm(p)}</h3><span class="bd">${cl(p.c)}</span>${badge()}<p style="margin:6px 0;font-size:14px">${p.d[ix()]} ${fd(p)}</p><div class="row"><a class="btn s" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.la},${p.ln}" style="text-decoration:none">🧭 ${t('dir')}</a><button class="btn s" onclick="shr(${p.id})">↗ ${t('sh')}</button></div></div>`}
function mapRefresh(fit){const ch=document.getElementById('mchips');if(!ch)return;const r=list(),p=P.find(x=>x.id==S.sel);
ch.innerHTML=`<button class="chip ${S.cat?'':'on'}" onclick="S.cat='';mapRefresh(1)">الكل / All</button>`+CK.map(k=>`<button class="chip ${S.cat==k?'on':''}" onclick="S.cat='${k}';mapRefresh(1)">${C[k][0]} ${cl(k)}</button>`).join('')+(S.route?`<button class="chip" onclick="S.route=null;mapRefresh(1)">✕ ${t('tp')}</button>`:'');
document.getElementById('mnote').textContent=B(r.length+' نتيجة',r.length+' results');
document.getElementById('mres').innerHTML=r.map(x=>`<div class="card" tabindex="0" onclick="selPlace(${x.id})" onkeydown="if(event.key=='Enter')selPlace(${x.id})"><b>${C[x.c][0]} ${nm(x)}</b> <small>${fd(x)}</small></div>`).join('')||`<p>${t('none')}</p>`;
document.getElementById('mcard').innerHTML=p?cardHtml(p):'';loadImgs();
if(!LM)return;LK.clearLayers();LR.clearLayers();
r.forEach(x=>{const m=L.marker([x.la,x.ln],{icon:L.divIcon({className:'',html:`<div class="mk" style="background:${COL[x.c]||'#555'}">${C[x.c][0]}</div>`,iconSize:[34,34],iconAnchor:[17,17]}),title:nm(x),keyboard:true});m.on('click',()=>selPlace(x.id));m.addTo(LK)});
if(S.route&&S.route.length){L.polyline(S.route.map(x=>[x.la,x.ln]),{color:'#C8963E',weight:4,dashArray:'8 6'}).addTo(LR);S.route.forEach((x,i)=>L.marker([x.la,x.ln],{icon:L.divIcon({className:'',html:`<div class="rn">${i+1}</div>`,iconSize:[22,22],iconAnchor:[11,34]})}).addTo(LR))}
const fp=(S.route&&S.route.length)?S.route:r;
if(fit&&fp.length)LM.fitBounds(L.latLngBounds(fp.map(x=>[x.la,x.ln])),{padding:[40,40],maxZoom:14});
else if(p)LM.setView([p.la,p.ln],15)}
function locate(){if(!navigator.geolocation){alert(t('nf'));return}navigator.geolocation.getCurrentPosition(g=>{S.pos={la:g.coords.latitude,ln:g.coords.longitude};mapRefresh(0);if(LM){userMark();LM.setView([S.pos.la,S.pos.ln],14)}},()=>{const n=document.getElementById('mnote');if(n)n.textContent=B('لم تتم مشاركة الموقع. الخريطة تعمل بدونه.','Location not shared. The map works without it.')},{timeout:8000})}
function shr(id){const p=P.find(x=>x.id==id),u=location.href;if(navigator.share)navigator.share({title:nm(p),url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u)}catch(e){}alert(t('ok'))}}
function trip(){const ks=['site','museum'];return `<h2>${t('tp')}</h2>${note()}<div class="card"><b>${t('int')}</b><div class="chips">${ks.map(k=>`<button class="chip ${S.ints.has(k)?'on':''}" onclick="S.ints.has('${k}')?S.ints.delete('${k}'):S.ints.add('${k}');render()">${C[k][0]} ${cl(k)}</button>`).join('')}</div><button class="btn" onclick="mk()">${t('gen')}</button></div><div id="tr">${S.plan?plan():''}</div>`}
function build(ints){const pick=c=>P.filter(p=>p.c==c);let s=[];if(ints.has('site'))s.push(...pick('site').slice(0,2));if(ints.has('museum'))s.push(pick('museum')[0]);if(ints.has('food'))s.push(pick('food')[0]);if(ints.has('cafe'))s.push(pick('cafe')[0]);s=s.filter(Boolean);if(!s.length)return[];const o=[s.shift()];while(s.length){const l=o[o.length-1];s.sort((a,b)=>dist(l,a)-dist(l,b));o.push(s.shift())}return o}
function mk(){S.plan=build(S.ints);render()}
function plan(){const hs=['08:00','10:30','13:00','15:30','18:00','20:00'];return S.plan.length?`<div class="tl">${S.plan.map((p,i)=>`<div><b>${hs[i]||''}</b> · ${C[p.c][0]} ${nm(p)} ${badge()}</div>`).join('')}</div><button class="btn" onclick="go('map',{route:S.plan,q:'',cat:'',sel:null})">🗺️ ${t('stm')}</button>`:`<p>${t('none')}</p>`}
function ai(){return `<h2>🤖 Luxor AI</h2>${note()}<div class="card"><div class="chat" id="ch"><div class="m a">${t('aiw')}</div>${S.chat.map(m=>`<div class="m ${m[0]}">${m[1]}</div>`).join('')}</div><form class="sb" style="margin:8px 0 0;border:1px solid var(--bd);max-width:none" onsubmit="event.preventDefault();ask(this.q.value);this.q.value=''"><input name="q" placeholder="${t('aip')}" aria-label="${t('aip')}" style="color:var(--tx)"><button class="btn">${t('send')}</button></form><div class="chips">${['اعمل لي برنامج يوم','معبد','متحف','مطاعم','فنادق','Plan my day'].map(s=>`<button class="chip" onclick="ask('${s}')">${s}</button>`).join('')}</div></div>`}
function ask(q){if(!q.trim())return;S.chat.push(['u',q]);const n=norm(q);let a;
if(/برنامج|رحله|يوم|plan|trip|itinerary/.test(n)){S.plan=build(new Set(['site','museum','food']));a=S.plan.map((p,i)=>`${i+1}. ${nm(p)}`).join('\n')+'\n'+t('price');setTimeout(()=>{},0);S.chat.push(['a',a+'\n👉 <a href="#" onclick="go(\'map\',{route:S.plan,q:\'\',cat:\'\',sel:null});return false">'+t('stm')+'</a>']);return render()}
if(/مطعم|مطاعم|اكل|restaurant|food|فندق|فنادق|hotel/.test(n)){const h=/فندق|فنادق|hotel/.test(n);a=FP.filter(f=>f[0]==(h?'hotel':'food')).map(f=>`• ${B(f[2],f[1])} <a href="${gm(f[1])}" target="_blank" rel="noopener">${B('خرائط جوجل','Google Maps')}</a>`).join('\n')+'\n'+B('المصدر: دليل Local Guide to Egypt. للمواقع والأسعار وساعات العمل راجع خرائط جوجل.','Source: Local Guide to Egypt. For locations, prices and hours, see Google Maps.');S.chat.push(['a',a]);return render()}
if(/وظيف|تدريب|فرص|تطوع|job|train|intern|volunt/.test(n)){a=O.map(o=>'• '+o[ix()]).join('\n')+'\n'+t('apply')}
else{let c=CK.find(k=>norm(C[k][3]).split(' ').some(w=>w.length>2&&n.includes(w)));if(c){if(/قريب|near/.test(n)&&!S.pos){a=t('nolo')}else{let r=P.filter(p=>p.c==c);if(S.pos)r.sort((x,y)=>dist(S.pos,x)-dist(S.pos,y));a=r.slice(0,3).map(p=>`• ${nm(p)} ${fd(p)} <a href="#" onclick="go('map',{sel:${p.id}});return false">${t('map1')}</a>`).join('\n')}}else a=t('nf')}
S.chat.push(['a',a]);render()}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\/[^\s"'<>]+$/i.test(u||'')?u:'';
const waNum=x=>{let d=String(x||'').replace(/\D/g,'');if(/^01\d{9}$/.test(d))d='20'+d.slice(1);return d};
const SEL=(n,o)=>`<p><select name="${n}" class="ib" style="width:100%">${o.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('')}</select></p>`;
const CONSENT=()=>`<p style="font-size:13px"><label><input type="checkbox" name="consent" required> ${B('أوافق على نشر هذه البيانات علنًا بعد مراجعتها.','I agree to publish this information publicly after review.')}</label></p>`;
const F=(n,ph,r)=>`<p><input name="${n}" ${r?'required':''} maxlength="200" placeholder="${ph}" aria-label="${ph}" class="ib" style="width:100%"></p>`;
const HP='<input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">';
async function loadRemote(){try{const r=await fetch(SB+'/rest/v1/submissions?status=eq.approved&kind=in.(business,job)&select=id,kind,payload&order=created_at.desc&limit=100',{headers:{apikey:KEY}});if(!r.ok)throw 0;const rows=await r.json();S.remote=rows;
for(let i=P.length-1;i>=0;i--)if(P[i].id>=1000)P.splice(i,1);
rows.filter(x=>x.kind=='business').forEach((x,i)=>{const p=x.payload||{},la=+p.lat,ln=+p.lng;if(p.n&&isFinite(la)&&isFinite(ln)&&la>=22&&la<=32&&ln>=24&&ln<=37)P.push({id:1000+i,c:'business',la:la,ln:ln,n:[String(p.n),String(p.n)],d:[String(p.d||p.c||''),String(p.d||p.c||'')]})});
if(P.some(p=>p.c=='business')&&!CK.includes('business'))CK.push('business');
if(['biz','ops','explore'].includes(S.v))render();else if(S.v=='map'&&LM)mapRefresh(0)}catch(e){S.remote=S.remote||[]}}
function bizCard(x){const p=x.payload||{},ph=String(p.ph||'').replace(/[^\d+]/g,''),wa=waNum(p.wa),so=safeUrl(p.so),hasLoc=isFinite(+p.lat)&&isFinite(+p.lng)&&p.lat!=null&&p.lat!=='';
return `<div class="card"><h3>${esc(p.n)}</h3>${p.c?`<span class="bd">${esc(p.c)}</span>`:''}${p.d?`<p>${esc(p.d)}</p>`:''}${p.ad?`<p>📍 ${esc(p.ad)}</p>`:''}<div class="row">${ph?`<a class="btn s" href="tel:${ph}" style="text-decoration:none">📞 ${esc(p.ph)}</a>`:''}${wa?`<a class="btn s" target="_blank" rel="noopener" href="https://wa.me/${wa}" style="text-decoration:none">💬 WhatsApp</a>`:''}${so?`<a class="btn s" target="_blank" rel="noopener" href="${esc(so)}" style="text-decoration:none">🔗</a>`:''}${hasLoc?`<button class="btn s" onclick="go('map',{cat:'business',q:'',sel:null})">🗺️ ${B('على الخريطة','On map')}</button>`:''}</div></div>`}
function biz(){const list=(S.remote||[]).filter(x=>x.kind=='business');
const cats=[B('مطعم','Restaurant'),B('كافيه','Cafe'),B('محل','Shop'),B('حرف يدوية','Handicrafts'),B('خدمات رحلات','Tour services'),B('تصوير','Photography'),B('تصميم','Design'),B('عمل حر','Freelance'),B('منتجات محلية','Local products'),B('أخرى','Other')];
return `<h2>🏪 ${B('الأنشطة المحلية','Local Businesses')}</h2>${S.remote===null?`<p>${B('جارٍ التحميل...','Loading...')}</p>`:list.length?`<div class="grid">${list.map(bizCard).join('')}</div>`:`<div class="card">${B('سيظهر هنا كل نشاط بعد مراجعته واعتماده. سجّل نشاطك من النموذج أدناه.','Each business appears here after review and approval. Register yours using the form below.')}</div>`}<div class="card"><h3>➕ ${B('أضف نشاطك','Add Your Business')}</h3><form onsubmit="subm(event,'business')">${F('n',B('اسم النشاط','Business name'),1)}${SEL('c',cats)}${F('d',B('وصف قصير','Short description'))}${F('ph',B('الهاتف','Phone'))}${F('wa','WhatsApp')}${F('ad',B('العنوان','Address'))}${F('so',B('رابط فيسبوك أو إنستجرام (اختياري)','Facebook or Instagram link (optional)'))}<p style="font-size:13px"><label><input type="checkbox" name="loc"> ${B('أنا في مكان النشاط الآن، أرفق موقعي ليظهر على الخريطة','I am at the business now, attach my location so it appears on the map')}</label></p>${CONSENT()}${HP}<button class="btn">${B('إرسال للمراجعة','Submit for review')}</button></form><div id="fm" role="status"></div></div>`}
function jobCard(x){const p=x.payload||{},url=safeUrl(p.ap);
return `<div class="card">${p.tp?`<span class="bd">${esc(p.tp)}</span>`:''}<h3>${esc(p.t)}</h3><p>${esc(p.o)}</p>${p.d?`<p>${esc(p.d)}</p>`:''}${p.rq?`<p>${B('المتطلبات: ','Requirements: ')}${esc(p.rq)}</p>`:''}${p.dl?`<p>${B('آخر موعد: ','Deadline: ')}${esc(p.dl)}</p>`:''}${p.ap?(url?`<a class="btn" target="_blank" rel="noopener" href="${esc(url)}" style="text-decoration:none;display:inline-block">${B('تقديم','Apply')}</a>`:`<p>${B('للتقديم: ','To apply: ')}<b>${esc(p.ap)}</b></p>`):''}</div>`}
function ops(){const list=(S.remote||[]).filter(x=>x.kind=='job');
const types=[B('وظيفة','Job'),B('تدريب','Training'),B('تدريب داخلي','Internship'),B('تطوع','Volunteering'),B('عمل حر','Freelance'),B('منحة','Scholarship')];
return `<h2>${t('opsT')}</h2>${S.remote===null?`<p>${B('جارٍ التحميل...','Loading...')}</p>`:list.length?`<div class="grid">${list.map(jobCard).join('')}</div>`:`<div class="card"><h3>💼 ${B('منصة فرص العمل','Jobs platform')}</h3><p>${B('تُنشر هنا الوظائف والتدريب والتطوع بعد مراجعتها واعتمادها. إن كنت جهة أو صاحب عمل فانشر فرصتك من النموذج أدناه.','Jobs, training and volunteering are published here after review and approval. If you are an employer or organization, post your opportunity using the form below.')}</p></div>`}<div class="card"><h3>➕ ${B('انشر فرصة عمل','Post an opportunity')}</h3><form onsubmit="subm(event,'job')">${F('t',B('المسمى الوظيفي أو عنوان الفرصة','Job title or opportunity title'),1)}${F('o',B('الجهة أو صاحب العمل','Organization or employer'),1)}${SEL('tp',types)}${F('d',B('وصف قصير','Short description'))}${F('rq',B('المتطلبات','Requirements'))}${F('dl',B('آخر موعد للتقديم','Application deadline'))}${F('ap',B('طريقة التقديم: رابط أو رقم أو إيميل','How to apply: link, phone or email'),1)}${CONSENT()}${HP}<button class="btn">${B('إرسال للمراجعة','Submit for review')}</button></form><div id="fm" role="status"></div></div>`}
async function subm(e,kind){e.preventDefault();const f=e.target,m=document.getElementById('fm');let last=0;try{last=+localStorage.getItem('lt')||0}catch(x){}
if(f.website&&f.website.value){m.textContent=B('تم الإرسال.','Sent.');return}
if(Date.now()-last<60000){m.textContent=B('انتظر دقيقة قبل إرسال طلب آخر.','Please wait a minute before sending another.');return}
m.textContent=B('جارٍ الإرسال...','Sending...');
const p={},id={report:'R-',business:'B-',job:'J-'}[kind]+Math.random().toString(36).slice(2,8).toUpperCase();
for(const el of f.elements){if(el.name&&el.name!='website'&&el.type!='checkbox'&&el.value)p[el.name]=el.value.slice(0,300)}
p.id=id;p.lang=S.lang;
try{if(f.loc&&f.loc.checked){const g=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:8000}));p.lat=+g.coords.latitude.toFixed(5);p.lng=+g.coords.longitude.toFixed(5)}}catch(x){}
try{const r=await fetch(SB+'/rest/v1/submissions',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({kind,payload:p})});
if(!r.ok)throw 0;try{localStorage.setItem('lt',Date.now())}catch(x){}f.reset();m.innerHTML='✅ '+B('تم الإرسال، وسيظهر بعد المراجعة. رقم الطلب: ','Sent. It will appear after review. Reference: ')+'<b>'+esc(id)+'</b>'}
catch(x){m.textContent='❌ '+B('تعذر الإرسال. حاول مرة أخرى.','Could not send. Please try again.')}}
function rep(){const cs=[['Garbage','قمامة'],['Road Damage','تلف طريق'],['Broken Street Light','عمود إنارة معطل'],['Water Leak','تسريب مياه'],['Public Facility','مرفق عام'],['Other','أخرى']];return `<h2>📢 ${B('بلاغات المجتمع','Community Reports')}</h2><div class="note">${B('هذه المنصة ليست جهة حكومية ولا بديلًا رسميًا للجهات الحكومية. للطوارئ تواصل مع الجهات الرسمية.','This platform is not a government body or an official substitute. For emergencies contact official services.')}</div><div class="card"><form onsubmit="subm(event,'report')"><p><select name="c" class="ib" style="width:100%">${cs.map(c=>`<option value="${c[0]}">${B(c[1],c[0])}</option>`).join('')}</select></p>${F('d',B('وصف المشكلة','Describe the issue'),1)}<p><label><input type="checkbox" name="loc"> ${B('أرفق موقعي الحالي','Attach my current location')}</label></p>${HP}<button class="btn">${B('إرسال البلاغ','Submit report')}</button></form><div id="fm" role="status"></div><p style="font-size:12px">${B('تتم مراجعة البلاغات يدويًا. لا نجمع اسمك أو رقم هاتفك.','Reports are reviewed manually. We do not collect your name or phone.')}</p></div>`}

function about(){const f=[['🗺️','خريطة ذكية بالتضاريس والشوارع والقمر الصناعي','Smart map with terrain, streets and satellite'],['🏺','دليل المعالم والمتاحف ومحطات النقل','Guide to landmarks, museums and transport hubs'],['📅','مخطط رحلة يوم في الأقصر','One-day trip planner'],['🤖','مساعد يجيب من بيانات المنصة المعتمدة فقط','Assistant that answers only from approved platform data'],['🏪','تسجيل الأنشطة المحلية بعد المراجعة','Local business registration after review'],['📢','بلاغات المواطنين تُحال للمراجعة اليدوية','Citizen reports routed to manual review']];
const d=[['المعالم والمتاحف ومحطات النقل','Landmarks, museums, transport hubs','متاح','Available'],['أرقام الطوارئ القومية','National emergency numbers','متاح (تُؤكَّد رسميًا)','Available (to be officially confirmed)'],['المستشفيات والصيدليات','Hospitals and pharmacies','يحتاج قوائم معتمدة','Needs official lists'],['المطاعم والفنادق والمحلات','Restaurants, hotels, shops','يحتاج تسجيل أصحاب الأنشطة ومراجعتها','Needs business registration and review'],['الأسعار وساعات العمل','Prices and opening hours','يحتاج مصدرًا رسميًا','Needs an official source'],['فرص العمل والتدريب','Jobs and training','يحتاج جهات شريكة','Needs partner organizations'],['الصور','Photos','تحتاج صورًا بحقوق استخدام واضحة','Need photos with clear usage rights']];
const ph=[['1','إطلاق الخريطة ودليل المعالم والتنقل','Launch map, landmark guide and transport','✔'],['2','جمع البيانات واعتمادها مع الجهات المختصة','Collect and approve data with competent authorities',''],['3','حسابات المستخدمين ولوحة مراجعة وإدارة','User accounts and an admin review dashboard',''],['4','فرص العمل والأنشطة والبلاغات، ثم تطبيق للجوال','Jobs, businesses, reports, then a mobile app','']];
return `<h2>${B('عن المشروع','About the project')}</h2><div class="card"><h3>LUXOR HUB</h3><p>${B('منصة رقمية لمدينة الأقصر تجمع المعالم والخدمات والتنقل والفرص والأنشطة المحلية في مكان واحد، وتخدم السكان والزوار وأصحاب الأنشطة والباحثين عن عمل.','A digital platform for Luxor that brings landmarks, services, transport, opportunities and local businesses together for residents, visitors, business owners and job seekers.')}</p></div><h3>${B('ما يتوفر اليوم','Available today')}</h3><div class="grid">${f.map(a=>`<div class="card"><div style="font-size:26px">${a[0]}</div><p style="color:var(--tx)">${a[1+ix()]}</p></div>`).join('')}</div><h3>${B('خارطة البيانات','Data roadmap')}</h3><div class="grid">${d.map(a=>`<div class="card"><b>${a[ix()]}</b><p>${a[2+ix()]}</p></div>`).join('')}</div><h3>${B('مراحل التنفيذ','Phases')}</h3><div class="tl">${ph.map(a=>`<div><b>${a[0]}.</b> ${a[1+ix()]} ${a[3]}</div>`).join('')}</div><div class="card"><h3>${B('المطلوب لاستكمال المشروع','What is needed to complete it')}</h3><p>${B('1) قوائم رسمية معتمدة للخدمات (مستشفيات، صيدليات، مواصلات). 2) جهة اتصال لاعتماد المعلومات قبل نشرها. 3) دعم في التعريف بالمنصة بين أصحاب الأنشطة والجهات المشغِّلة لفرص العمل.','1) Official approved lists of services (hospitals, pharmacies, transport). 2) A point of contact to approve information before publication. 3) Support in introducing the platform to business owners and employers.')}</p></div><p class="note">${B('مشروع تنموي مقترح لمدينة الأقصر. المنصة لا تمثل جهة حكومية ولا تدّعي أنها بديل عنها، ولا تُنشر معلومة إلا بمصدرها وحالة اعتمادها.','A proposed development project for Luxor. The platform does not represent a government body, and information is published only with its source and verification status.')}</p>`}
function contact(){const E='ahmedgamal.3.ag7@gmail.com';return `<h2>${B('تواصل معنا','Contact')}</h2><div class="card"><div style="font-size:42px">👤</div><h3>${B('أحمد جمال أحمد','Ahmed Gamal Ahmed')}</h3><p style="color:var(--tx)"><b>${B('مؤسس مشروع «مركز الأقصر» (Luxor Hub)','Founder of Luxor Hub')}</b></p><p><a class="btn" style="text-decoration:none;display:inline-block" href="mailto:${E}">✉️ ${E}</a></p></div><div class="card"><h3>${B('عن المشروع وصاحبه','About the project and its founder')}</h3><p style="color:var(--tx)">${B('أنا أحمد، طالب في المرحلة الإعدادية من أهل الأقصر. بدأت هذا المشروع بفكرة بسيطة: أن يجد الزائر وابن المدينة ما يحتاجه عن الأقصر في مكان واحد، من المعالم والمتاحف إلى وسائل التنقل وأرقام الطوارئ وفرص العمل والأنشطة المحلية.','I am Ahmed, a middle-school student from Luxor. I started this project with a simple idea: that visitors and locals can find what they need about Luxor in one place, from landmarks and museums to transport, emergency numbers, jobs and local businesses.')}</p><p style="color:var(--tx)">${B('المشروع في مرحلته الأولى، ويسعدني أن يتطور بدعم الجهات المحلية وأهل المدينة، وبمعلومات معتمدة من مصادرها الرسمية. أرحب بأي ملاحظة أو اقتراح أو تصحيح.','The project is in its first stage. I would be glad to see it grow with the support of local authorities and the people of Luxor, using information approved by official sources. Any feedback, suggestion or correction is welcome.')}</p></div><div class="card"><h3>${B('كيف يمكنكم المساهمة؟','How can you contribute?')}</h3><p style="color:var(--tx)">${B('• الجهات المختصة: مدّونا بقوائم معتمدة للخدمات (مستشفيات، صيدليات، مواصلات).','• Authorities: share approved lists of services (hospitals, pharmacies, transport).')}<br>${B('• أصحاب الأنشطة: سجّلوا أنشطتكم من صفحة «الأنشطة».','• Business owners: register your business from the Businesses page.')}<br>${B('• الأهالي والزوار: أبلغوا عن أي خطأ أو أضيفوا اقتراحًا بالتواصل معي.','• Residents and visitors: tell me about any error or suggestion.')}</p></div>`}
const WK={1:'Karnak',2:'Luxor_Temple',3:'Valley_of_the_Kings',4:'Mortuary_Temple_of_Hatshepsut',5:'Ramesseum',6:'Medinet_Habu_(temple)',7:'Colossi_of_Memnon',8:'Valley_of_the_Queens',9:'Deir_el-Medina',10:'Tombs_of_the_Nobles',11:'Temple_of_Esna',12:'Luxor_Museum',13:'Mummification_Museum',14:'Luxor_railway_station',15:'Luxor_International_Airport'};
const IMG={};
function getImg(id){if(!WK[id])return Promise.resolve(null);if(!IMG[id])IMG[id]=fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+WK[id]).then(r=>r.ok?r.json():null).then(j=>{const u=j&&j.thumbnail&&j.thumbnail.source;return u?u.replace(/\/\d+px-/,'/700px-'):null}).catch(()=>null);return IMG[id]}
function loadImgs(){document.querySelectorAll('[data-wk]:not([data-done])').forEach(el=>{el.setAttribute('data-done','1');getImg(el.getAttribute('data-wk')).then(u=>{if(!u)return;const i=new Image();i.onload=()=>{el.style.backgroundImage='url("'+u+'")';el.classList.add('has');el.textContent=''};i.src=u})})}
const FP=[
['food','Sofra','سفرة','مطعم في منزل قديم من ثلاثينيات القرن الماضي.','A restaurant in a converted 1930s house.'],
['food','El Kababgy','الكبابجي','مطعم على النيل بجلسات خارجية مطلة على النهر.','A restaurant on the Nile with outdoor riverside seating.'],
['food','Casa di Napoli','كازا دي نابولي','مطعم داخل فندق ستايجنبرجر نايل بالاس.','A restaurant inside the Steigenberger Nile Palace hotel.'],

['food','Al Sahaby Lane','Al Sahaby Lane','مطعم في السوق بسطح يطل على النيل ومعبد الأقصر وطريق الكباش.','A souk restaurant with a rooftop overlooking the Nile, Luxor Temple and the Avenue of the Sphinxes.'],
['hotel','Sofitel Winter Palace Luxor','سوفيتل وينتر بالاس الأقصر','فندق تاريخي على النيل.','A historic hotel on the Nile.'],

function fcards(){return `<h2>${B('مطاعم وفنادق مشهورة','Well-known restaurants and hotels')}</h2><p style="font-size:13px;color:var(--mu)">${B('مذكورة في دليل Local Guide to Egypt. الموقع والتقييمات وساعات العمل والأسعار على خرائط جوجل.','Listed in the Local Guide to Egypt. Location, ratings, hours and prices are on Google Maps.')}</p><div class="grid">${FP.map(f=>`<div class="card"><div style="font-size:30px">${f[0]=='food'?'🍽':'🏨'}</div><h3>${B(f[2],f[1])}</h3><span class="bd">${f[0]=='food'?B('مطعم','Restaurant'):B('فندق','Hotel')}</span><p>${B(f[3],f[4])}</p><a class="btn s" target="_blank" rel="noopener" href="${gm(f[1])}" style="text-decoration:none;display:inline-block">📍 ${B('افتح في خرائط جوجل','Open in Google Maps')}</a></div>`).join('')}</div>`}
/* ===== لوحة الإدارة (مخفية: افتحها بإضافة #admin للرابط) ===== */
const AD={tok:null,rows:[],f:'pending',k:'',err:'',busy:false};
try{AD.tok=sessionStorage.getItem('lxa')||null}catch(e){}
const AH=()=>({apikey:KEY,Authorization:'Bearer '+AD.tok,'Content-Type':'application/json'});
async function adLogin(e){e.preventDefault();const f=e.target;AD.err='';AD.busy=true;render();
try{const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:f.em.value.trim(),password:f.pw.value})});const j=await r.json();if(!r.ok||!j.access_token)throw 0;AD.tok=j.access_token;try{sessionStorage.setItem('lxa',AD.tok)}catch(x){}await adLoad()}catch(x){AD.err=B('بيانات الدخول غير صحيحة','Wrong email or password')}AD.busy=false;render()}
async function adLoad(){try{const r=await fetch(SB+'/rest/v1/submissions?select=*&order=created_at.desc&limit=300',{headers:AH()});if(r.status==401||r.status==403){adOut();return}if(!r.ok)throw 0;AD.rows=await r.json();AD.err=''}catch(x){AD.err=B('تعذّر تحميل البيانات','Could not load data')}}
function adOut(){AD.tok=null;AD.rows=[];try{sessionStorage.removeItem('lxa')}catch(e){}render()}
async function adSet(id,st){try{const r=await fetch(SB+'/rest/v1/submissions?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...AH(),Prefer:'return=representation'},body:JSON.stringify({status:st})});const j=await r.json();if(!r.ok||!j.length)throw 0;const x=AD.rows.find(a=>a.id==id);if(x)x.status=st;AD.err=''}catch(x){AD.err=B('لم يتم الحفظ. تأكد من تشغيل كود الإدارة SQL','Save failed. Make sure the admin SQL was run')}render()}
async function adLL(id){const v=prompt(B('اكتب الإحداثيات هكذا: 25.7000,32.6400 (من خرائط جوجل: اضغط مطولًا على المكان وانسخ الرقمين)','Type coordinates like: 25.7000,32.6400'));if(!v)return;const m=v.replace(/[،;]/g,',').split(',').map(s=>parseFloat(s.trim()));if(m.length<2||isNaN(m[0])||isNaN(m[1])||m[0]<24||m[0]>27||m[1]<31||m[1]>34){alert(B('أرقام غير صحيحة أو خارج منطقة الأقصر','Invalid or outside Luxor'));return}const x=AD.rows.find(a=>a.id==id);const p={...x.payload,lat:m[0],lng:m[1]};try{const r=await fetch(SB+'/rest/v1/submissions?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...AH(),Prefer:'return=representation'},body:JSON.stringify({payload:p})});const j=await r.json();if(!r.ok||!j.length)throw 0;x.payload=p}catch(e){alert(B('لم يتم الحفظ','Save failed'))}render()}
function admin(){
if(!AD.tok)return `<h2>🔐 ${B('دخول الإدارة','Admin sign-in')}</h2><form class="card" style="max-width:380px;display:grid;gap:10px" onsubmit="adLogin(event)"><input name="em" type="email" required placeholder="${B('البريد الإلكتروني','Email')}" autocomplete="username" style="padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)"><input name="pw" type="password" required placeholder="${B('كلمة المرور','Password')}" autocomplete="current-password" style="padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)"><button class="btn" ${AD.busy?'disabled':''}>${AD.busy?'...':B('دخول','Sign in')}</button>${AD.err?`<p style="color:#d33">${esc(AD.err)}</p>`:''}</form>`;
const L=AD.rows.filter(r=>(!AD.f||r.status==AD.f)&&(!AD.k||r.kind==AD.k));const c=s=>AD.rows.filter(r=>r.status==s).length;
const KN={report:B('بلاغ','Report'),business:B('نشاط','Business'),job:B('وظيفة','Job')},SN={pending:B('قيد المراجعة','Pending'),approved:B('معتمد','Approved'),rejected:B('مرفوض','Rejected')};
const chip=(a,b,on,fn)=>`<button class="btn ${on?'':'s'}" style="padding:6px 12px;font-size:13px" onclick="${fn}">${a}</button>`;
return `<h2>🛠️ ${B('لوحة الإدارة','Admin panel')}</h2><div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${['pending','approved','rejected',''].map(s=>chip((s?SN[s]+' ('+c(s)+')':B('الكل','All')),0,AD.f==s,`AD.f='${s}';render()`)).join('')}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${['','business','job','report'].map(k=>chip(k?KN[k]:B('كل الأنواع','All types'),0,AD.k==k,`AD.k='${k}';render()`)).join('')}<button class="btn s" style="padding:6px 12px;font-size:13px" onclick="adLoad().then(render)">🔄 ${B('تحديث','Refresh')}</button><button class="btn s" style="padding:6px 12px;font-size:13px" onclick="adOut()">${B('خروج','Sign out')}</button></div>${AD.err?`<p style="color:#d33">${esc(AD.err)}</p>`:''}<p style="font-size:13px;color:var(--mu)">${B('البلاغات لا تظهر للجمهور أبدًا. الأنشطة والوظائف المعتمدة فقط هي اللي تظهر. النشاط يظهر على الخريطة لو له إحداثيات.','Reports are never public. Only approved businesses/jobs appear. A business shows on the map if it has coordinates.')}</p><div style="display:grid;gap:10px">${L.length?L.map(r=>{const p=r.payload||{};const hasLL=typeof p.lat=='number'&&typeof p.lng=='number';return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${KN[r.kind]||esc(r.kind)} · ${SN[r.status]||esc(r.status)}</b><span style="font-size:12px;color:var(--mu)">${esc((r.created_at||'').slice(0,16).replace('T',' '))}</span></div>${Object.entries(p).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(String(v))}</p>`).join('')}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn" onclick="adSet('${esc(r.id)}','approved')">✅ ${B('اعتماد','Approve')}</button><button class="btn s" onclick="adSet('${esc(r.id)}','rejected')">❌ ${B('رفض','Reject')}</button><button class="btn s" onclick="adSet('${esc(r.id)}','pending')">↩️ ${B('إرجاع للمراجعة','Pending')}</button>${r.kind=='business'?`<button class="btn s" onclick="adLL('${esc(r.id)}')">📍 ${hasLL?B('تعديل الموقع','Edit location'):B('إضافة موقع','Add location')}</button>`:''}</div></div>`}).join(''):`<p>${B('لا توجد عناصر','Nothing here')}</p>`}</div>`}
function render(){if(S.v!='map'&&LM){try{LM.remove()}catch(e){}LM=null}const f={home,explore,ops,trip,ai,biz,rep,mv,em,about,contact,admin}[S.v]||mapv;$('#app').innerHTML=f();setTimeout(loadImgs,0);if(S.v=='map')initMap();const c=$('#ch');if(c)c.scrollTop=c.scrollHeight}
$('#lg').onclick=()=>{S.lang=S.lang=='ar'?'en':'ar';document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';$('#lg').textContent=S.lang=='ar'?'EN':'ع';nav();render()};
$('#th').onclick=()=>{const d=document.documentElement,dk=getComputedStyle(d).getPropertyValue('--bg').trim()=='#0B1A21';d.dataset.theme=dk?'light':'dark'};
S.remote=null;if(location.hash=="#admin"){S.v="admin";if(AD.tok)adLoad().then(render)}nav();render();loadRemote();addEventListener("hashchange",()=>{if(location.hash=="#admin"){S.v="admin";if(AD.tok)adLoad().then(render);render()}});
</script></body></html>
