return `<div class="mp"><div class="pnl"><form class="sb" style="margin:0 0 6px;border:1px solid var(--bd);background:var(--sf)" onsubmit="event.preventDefault();S.q=this.q.value;S.sel=null;render()"><input name="q" value="${S.q.replace(/"/g,'')}" placeholder="${t('ph')}" aria-label="search" style="color:var(--tx)"><button class="btn">🔍</button></form>${chips()}<div class="row" style="margin:6px 0"><button class="btn s" onclick="locate()">📡 ${t('loc')}</button>${S.route?`<button class="btn s" onclick="S.route=null;render()">✕ ${t('tp')}</button>`:''}</div><div class="res">${r.map(p=>`<div class="card" tabindex="0" onclick="S.sel=${p.id};render()"><b>${C[p.c][0]} ${nm(p)}</b> <small>${fd(p)}</small></div>`).join('')||`<p>${t('none')}</p>`}</div></div><div class="mapw">${svg(r)}${card}</div></div>${note()}`}
function locate(){if(!navigator.geolocation){alert(t('nf'));return}navigator.geolocation.getCurrentPosition(g=>{S.pos={la:g.coords.latitude,ln:g.coords.longitude};render()},()=>{S.pos=null;render()},{timeout:8000})}
function shr(id){const p=P.find(x=>x.id==id),u=location.href;if(navigator.share)navigator.share({title:nm(p),url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u)}catch(e){}alert(t('ok'))}}
function ops(){return `<h2>${t('opsT')}</h2>${note()}<div class="card">${B('لا توجد فرص عمل موثقة حاليًا. ستظهر الفرص هنا بعد مراجعتها والتأكد منها.','No verified job opportunities yet. Listings will appear here after review.')}</div><div class="grid">${O.map(o=>`<div class="card"><h3>${o[ix()]}</h3>${badge()}<p>${t('dl')}</p><p>${t('apply')}</p></div>`).join('')}</div>`}
function trip(){const ks=['site','museum'];return `<h2>${t('tp')}</h2>${note()}<div class="card"><b>${t('int')}</b><div class="chips">${ks.map(k=>`<button class="chip ${S.ints.has(k)?'on':''}" onclick="S.ints.has('${k}')?S.ints.delete('${k}'):S.ints.add('${k}');render()">${C[k][0]} ${cl(k)}</button>`).join('')}</div><button class="btn" onclick="mk()">${t('gen')}</button></div><div id="tr">${S.plan?plan():''}</div>`}
function build(ints){const pick=c=>P.filter(p=>p.c==c);let s=[];if(ints.has('site'))s.push(...pick('site').slice(0,2));if(ints.has('museum'))s.push(pick('museum')[0]);if(ints.has('food'))s.push(pick('food')[0]);if(ints.has('cafe'))s.push(pick('cafe')[0]);s=s.filter(Boolean);if(!s.length)return[];const o=[s.shift()];while(s.length){const l=o[o.length-1];s.sort((a,b)=>dist(l,a)-dist(l,b));o.push(s.shift())}return o}
function mk(){S.plan=build(S.ints);render()}
function plan(){const hs=['08:00','10:30','13:00','15:30','18:00','20:00'];return S.plan.length?`<div class="tl">${S.plan.map((p,i)=>`<div><b>${hs[i]||''}</b> · ${C[p.c][0]} ${nm(p)} ${badge()}</div>`).join('')}</div><button class="btn" onclick="go('map',{route:S.plan,q:'',cat:'',sel:null})">🗺️ ${t('stm')}</button>`:`<p>${t('none')}</p>`}
function ai(){return `<h2>🤖 Luxor AI</h2>${note()}<div class="card"><div class="chat" id="ch"><div class="m a">${t('aiw')}</div>${S.chat.map(m=>`<div class="m ${m[0]}">${m[1]}</div>`).join('')}</div><form class="sb" style="margin:8px 0 0;border:1px solid var(--bd);max-width:none" onsubmit="event.preventDefault();ask(this.q.value);this.q.value=''"><input name="q" placeholder="${t('aip')}" aria-label="${t('aip')}" style="color:var(--tx)"><button class="btn">${t('send')}</button></form><div class="chips">${['اعمل لي برنامج يوم','معبد','متحف','Plan my day'].map(s=>`<button class="chip" onclick="ask('${s}')">${s}</button>`).join('')}</div></div>`}
function ask(q){if(!q.trim())return;S.chat.push(['u',q]);const n=norm(q);let a;
if(/برنامج|رحله|يوم|plan|trip|itinerary/.test(n)){S.plan=build(new Set(['site','museum','food']));a=S.plan.map((p,i)=>`${i+1}. ${nm(p)} (${t('dm')})`).join('\n')+'\n'+t('price');setTimeout(()=>{},0);S.chat.push(['a',a+'\n👉 <a href="#" onclick="go(\'map\',{route:S.plan,q:\'\',cat:\'\',sel:null});return false">'+t('stm')+'</a>']);return render()}
if(/وظيف|تدريب|فرص|تطوع|job|train|intern|volunt/.test(n)){a=O.map(o=>'• '+o[ix()]).join('\n')+'\n'+t('apply')}
else{let c=CK.find(k=>norm(C[k][3]).split(' ').some(w=>w.length>2&&n.includes(w)));if(c){if(/قريب|near/.test(n)&&!S.pos){a=t('nolo')}else{let r=P.filter(p=>p.c==c);if(S.pos)r.sort((x,y)=>dist(S.pos,x)-dist(S.pos,y));a=r.slice(0,3).map(p=>`• ${nm(p)} ${fd(p)} (${t('dm')}) <a href="#" onclick="go('map',{sel:${p.id}});return false">${t('map1')}</a>`).join('\n')}}else a=t('nf')}
S.chat.push(['a',a]);render()}

const dm=()=>`<span class="bd w">Demo Data</span>`;
function rp(){return(S.reps||[]).map(r=>`<g><circle cx="${X(r.ln)}" cy="${Y(r.la)}" r="11" fill="#D93B3B" stroke="#fff" stroke-width="2"/><text x="${X(r.ln)}" y="${+Y(r.la)+5}" text-anchor="middle" font-size="13">⚠️</text></g>`).join('')}
const F=(n,ph,r)=>`<p><input name="${n}" ${r?'required':''} maxlength="200" placeholder="${ph}" aria-label="${ph}" class="ib" style="width:100%"></p>`;
const HP='<input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">';
function biz(){return `<h2>🏪 ${B('الأنشطة المحلية','Local Businesses')}</h2>${note()}<div class="card">${B('لا توجد أنشطة موثقة حاليًا. ستظهر هنا بعد مراجعتها والتأكد منها.','No verified businesses yet. They appear here after review.')}</div><div class="card"><h3>➕ ${B('أضف نشاطك','Add Your Business')}</h3><form onsubmit="subm(event,'business')">${F('n',B('اسم النشاط','Business name'),1)}${F('c',B('التصنيف','Category'))}${F('ph',B('الهاتف','Phone'))}${F('wa','WhatsApp')}${F('ad',B('العنوان','Address'))}${F('d',B('وصف قصير','Short description'))}${HP}<button class="btn">${B('إرسال للمراجعة','Submit for review')}</button></form><div id="fm" role="status"></div><p style="font-size:12px">${B('الحالة بعد الإرسال: Pending Verification. لا يظهر Verified إلا بعد مراجعة الأدمن.','After submit: Pending Verification. Verified only after admin review.')}</p></div>`}
function rep(){const cs=[['Garbage','قمامة'],['Road Damage','تلف طريق'],['Broken Street Light','عمود إنارة معطل'],['Water Leak','تسريب مياه'],['Public Facility','مرفق عام'],['Other','أخرى']];return `<h2>📢 ${B('بلاغات المجتمع','Community Reports')}</h2><div class="note">${B('هذه المنصة ليست جهة حكومية ولا بديلًا رسميًا للجهات الحكومية. للطوارئ تواصل مع الجهات الرسمية.','This platform is not a government body or an official substitute. For emergencies contact official services.')}</div><div class="card"><form onsubmit="subm(event,'report')"><p><select name="c" class="ib" style="width:100%">${cs.map(c=>`<option value="${c[0]}">${B(c[1],c[0])}</option>`).join('')}</select></p>${F('d',B('وصف المشكلة','Describe the issue'),1)}<p><label><input type="checkbox" name="loc"> ${B('أرفق موقعي الحالي','Attach my current location')}</label></p>${HP}<button class="btn">${B('إرسال البلاغ','Submit report')}</button></form><div id="fm" role="status"></div><p style="font-size:12px">${B('تتم مراجعة البلاغات يدويًا. لا نجمع اسمك أو رقم هاتفك.','Reports are reviewed manually. We do not collect your name or phone.')}</p></div>`}
async function subm(e,kind){e.preventDefault();const f=e.target,m=document.getElementById('fm');let last=0;try{last=+localStorage.getItem('lt')||0}catch(x){}
if(f.website.value){m.textContent=B('تم الإرسال.','Sent.');return}
if(Date.now()-last<60000){m.textContent=B('انتظر دقيقة قبل إرسال طلب آخر.','Please wait a minute before sending another.');return}
m.textContent=B('جارٍ الإرسال...','Sending...');
const p={},id=(kind=='report'?'R-':'B-')+Math.random().toString(36).slice(2,8).toUpperCase();
for(const el of f.elements){if(el.name&&el.name!='website'&&el.name!='loc'&&el.value)p[el.name]=el.value.slice(0,300)}
p.id=id;p.lang=S.lang;
try{if(f.loc&&f.loc.checked){const g=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:8000}));p.lat=g.coords.latitude;p.lng=g.coords.longitude}}catch(x){}
try{const r=await fetch(SB+'/rest/v1/submissions',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({kind,payload:p})});
if(!r.ok)throw 0;try{localStorage.setItem('lt',Date.now())}catch(x){}f.reset();m.innerHTML='✅ '+B('تم الإرسال. رقم الطلب: ','Sent. Reference: ')+'<b>'+id+'</b>'}
catch(x){m.textContent='❌ '+B('تعذر الإرسال. حاول مرة أخرى.','Could not send. Please try again.')}}
function mv(){const m=[['🚕','تاكسي','Taxi'],['🐴','حنطور','Horse carriage'],['⛵','مراكب النيل / المعدية','Nile boats / ferry'],['🚌','أتوبيس','Bus']];return `<h2>🚕 ${B('التنقل','Move')}</h2>${note()}<div class="grid">${m.map(a=>`<div class="card"><h3>${a[0]} ${a[1+ix()]}</h3><p>Price not verified.</p><p>${B('نقاط التوقف والمواقع: غير متوفرة حاليًا.','Stops and locations: currently unavailable.')}</p></div>`).join('')}</div>`}
function em(){const e=[['👮','الشرطة','Police'],['🚑','الإسعاف','Ambulance'],['🚒','الإطفاء','Fire']];return `<h2>🚨 ${B('الطوارئ','Emergency')}</h2><div class="note">${B('الأرقام تُضاف فقط من مصدر رسمي موثوق. لا نخمّن أرقامًا في حالات الطوارئ.','Numbers are added only from an official source. We never guess emergency numbers.')}</div><div class="grid">${e.map(a=>`<div class="card"><h3>${a[0]} ${a[1+ix()]}</h3><p>${t('nf')}</p></div>`).join('')}</div><div class="row"><button class="btn s" onclick="go('map',{cat:'hosp',q:'',sel:null})">🏥 ${B('المستشفيات على الخريطة','Hospitals on map')}</button><button class="btn s" onclick="go('map',{cat:'pharm',q:'',sel:null})">💊 ${B('الصيدليات على الخريطة','Pharmacies on map')}</button></div>`}
function prof(){const sp=P.filter(p=>S.saved.has(p.id));return `<h2>❤️ My Luxor</h2><div class="note">${B('تسجيل دخول تجريبي (بدون كلمة مرور). الحسابات الحقيقية تأتي مع قاعدة البيانات.','Demo login (no password). Real accounts arrive with the database.')}</div><div class="chips">${['user','owner','admin'].map(r=>`<button class="chip ${S.role==r?'on':''}" onclick="S.role='${r}';render()">${{user:B('مستخدم','User'),owner:B('صاحب نشاط','Business Owner'),admin:'Admin'}[r]}</button>`).join('')}</div>${S.role=='admin'?`<button class="btn" onclick="go('adm')">⚙️ ${B('لوحة الأدمن','Admin dashboard')}</button>`:''}<h3>${B('أماكن محفوظة','Saved places')}</h3><div class="grid">${sp.map(pcard).join('')||`<p>${t('none')}</p>`}</div><h3>${B('بلاغاتي','My reports')}</h3>${S.reps.map(r=>`<p>${r.id} · ${r.c}</p>`).join('')||`<p>${t('none')}</p>`}`}
function adm(){if(S.role!='admin')return `<h2>⚙️ Admin</h2><div class="note">${B('للأدمن فقط. غيّر الدور من حسابي (تجريبي).','Admins only. Switch role in My Luxor (demo).')}</div>`;
const st=[[B('الأماكن','Places'),P.length],[B('الأنشطة','Businesses'),S.biz.length],[B('فرص العمل','Jobs'),O.length],[B('البلاغات','Reports'),S.reps.length],[B('المستخدمون','Users'),'—']];
return `<h2>⚙️ Admin</h2>${note()}<div class="grid">${st.map(a=>`<div class="card"><p>${a[0]}</p><h3 style="font-size:26px">${a[1]}</h3></div>`).join('')}</div><h3>${B('مراجعة الأنشطة','Business review')}</h3>${S.biz.map((b,i)=>`<div class="card" style="margin:6px 0"><b>${b.n[ix()]}</b> ${b.v?'✔ Verified':'Pending'} <button class="btn s" onclick="S.biz[${i}].v=${b.v?0:1};render()">${b.v?'Unverify':'Verify'}</button></div>`).join('')}<h3>${B('إدارة البلاغات','Report management')}</h3>${S.reps.map((r,i)=>`<div class="card" style="margin:6px 0"><b>${r.id}</b> ${r.c} · ${['Submitted','Under Review','Resolved'][r.st]} <button class="btn s" onclick="S.reps[${i}].st=(S.reps[${i}].st+1)%3;render()">→</button></div>`).join('')||`<p>${t('none')}</p>`}`}
function render(){const f={home,explore,ops,trip,ai,biz,rep,mv,em,prof,adm}[S.v]||mapv;$('#app').innerHTML=f();const c=$('#ch');if(c)c.scrollTop=c.scrollHeight}
$('#lg').onclick=()=>{S.lang=S.lang=='ar'?'en':'ar';document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';$('#lg').textContent=S.lang=='ar'?'EN':'ع';nav();render()};
$('#th').onclick=()=>{const d=document.documentElement,dk=getComputedStyle(d).getPropertyValue('--bg').trim()=='#0B1A21';d.dataset.theme=dk?'light':'dark'};
nav();render();
</script></body></html>
